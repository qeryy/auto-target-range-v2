name: Release

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

concurrency:
  group: release-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare release
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.existing.outputs.release }}
      sha: ${{ github.event.workflow_run.head_sha || github.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo '正式发布只能从 main 分支触发。' >&2
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - id: version
        name: Read source version
        shell: python
        run: |
          import ast
          import os
          import re
          from pathlib import Path

          tree = ast.parse(Path('src/spiritscout/__init__.py').read_text(encoding='utf-8'))
          version = next(
              ast.literal_eval(node.value)
              for node in tree.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == '__version__'
                      for target in node.targets)
          )
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'版本号不符合正式发布格式：{version}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'version={version}\n')
              output.write(f'tag=v{version}\n')
      - id: existing
        name: Check release eligibility
        uses: actions/github-script@v7
        env:
          TAG: ${{ steps.version.outputs.tag }}
        with:
          script: |
            const {owner, repo} = context.repo;
            const tag = process.env.TAG;
            try {
              const {data} = await github.rest.repos.getReleaseByTag({owner, repo, tag});
              if (data.draft) throw new Error(`Release ${tag} is still a draft`);
              core.info(`Release ${tag} already exists; skipping build`);
              core.setOutput('release', 'false');
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            try {
              await github.rest.git.getRef({owner, repo, ref: `tags/${tag}`});
              throw new Error(`Tag ${tag} already exists without a published release`);
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            core.setOutput('release', 'true');

  windows:
    name: Windows x64
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHON_DOTENV_DISABLED: '1'
      LITELLM_LOCAL_MODEL_COST_MAP: 'True'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.11'
          enable-cache: true
      - name: Build executable
        shell: pwsh
        run: ./packaging/windows/build-backend-console.ps1 -OutputDir dist/windows/backend-console
      - name: Verify first startup
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $env:SPIRITSCOUT_DATA_HOME = Join-Path $env:RUNNER_TEMP 'spiritscout-smoke'
          New-Item -ItemType Directory -Force $env:SPIRITSCOUT_DATA_HOME | Out-Null
          $app = Start-Process -FilePath (Resolve-Path "dist/windows/backend-console/SpiritScout-$env:VERSION-windows-x64-backend.exe") -ArgumentList '--host','127.0.0.1','--port','18001' -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($app.HasExited) { throw 'Executable exited before readiness' }
              try {
                $response = Invoke-WebRequest http://127.0.0.1:18001/login -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Login page did not become ready' }
            if (-not (Test-Path "$env:SPIRITSCOUT_DATA_HOME/configs/models.yaml")) { throw 'Missing initial model registry' }
          } finally {
            if (-not $app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Package executable
        shell: pwsh
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          $archive = "dist/windows/backend-console/SpiritScout-v$env:VERSION-windows-x64-backend.zip"
          Compress-Archive -Path "dist/windows/backend-console/SpiritScout-$env:VERSION-windows-x64-backend.exe",LICENSE -DestinationPath $archive
          $name = Split-Path $archive -Leaf
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          "$hash  $name" | Set-Content dist/windows/backend-console/SHA256SUMS-windows-x64 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: spiritscout-release-windows-x64
          path: |
            dist/windows/backend-console/SpiritScout-v${{ needs.prepare.outputs.version }}-windows-x64-backend.zip
            dist/windows/backend-console/SHA256SUMS-windows-x64
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub Release
    needs: [prepare, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: spiritscout-release-*
          path: dist/release
          merge-multiple: true
      - name: Verify artifacts and create aggregate checksum
        working-directory: dist/release
        run: |
          for sums in SHA256SUMS-*; do sha256sum -c "$sums"; done
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' \
            | sort | xargs sha256sum > SHA256SUMS
      - name: Create tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          mapfile -d '' assets < <(find dist/release -maxdepth 1 -type f -print0 | sort -z)
          if ((${#assets[@]} == 0)); then
            echo '没有可发布的文件。' >&2
            exit 1
          fi
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" \
            --title "SpiritScout v$VERSION" \
            --generate-notes
